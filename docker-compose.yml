services:
  postgres:
    image: postgres:16-alpine
    container_name: vealbiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vealbiz
      POSTGRES_USER: vealbiz_user
      POSTGRES_PASSWORD: vealbiz_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vealbiz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
