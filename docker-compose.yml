services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: vealbiz-db
    environment:
      POSTGRES_USER: ${DB_USER:-vealbiz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vealbiz_password}
      POSTGRES_DB: ${DB_NAME:-vealbiz}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vealbiz_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: vealbiz-api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-vealbiz_user}:${DB_PASSWORD:-vealbiz_password}@db:5432/${DB_NAME:-vealbiz}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_dummy_key_add_your_actual_key}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
    command: npm --prefix apps/api run dev

  # Frontend (optional - use Vite dev locally, or build for production)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: vealbiz-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/public:/app/apps/web/public
    command: npm --prefix apps/web run dev -- --host

volumes:
  postgres_data:
